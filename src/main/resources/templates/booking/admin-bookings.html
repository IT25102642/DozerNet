<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Manage bookings')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>
<div th:replace="~{fragments/common :: flash}"></div>

<section class="section">
    <div class="container">
        <div class="page-head">
            <div>
                <p class="eyebrow">Admin &middot; Bookings</p>
                <h1>Booking requests</h1>
            </div>
        </div>

        <form class="toolbar" th:action="@{/admin/bookings}" method="get">
            <select class="select" style="max-width:220px" name="status" onchange="this.form.submit()">
                <option value="">All statuses</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}"
                        th:selected="${selectedStatus != null and selectedStatus == s}"></option>
            </select>
            <a class="btn btn-ghost" th:href="@{/admin/bookings}">Reset</a>
            <a class="btn btn-ghost" th:href="@{/admin/inspections}">Return inspections</a>
        </form>

        <p class="muted" th:if="${#lists.isEmpty(bookings)}">No bookings to show.</p>

        <div class="table-wrap" th:unless="${#lists.isEmpty(bookings)}">
            <table class="data">
                <thead>
                <tr><th>Customer</th><th>Machine</th><th>Job site</th><th>Dates</th><th>Days</th><th>Total</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td th:text="${b.customer.fullName}">Customer</td>
                    <td>
                        <span th:text="${b.machine.model}">Machine</span>
                        <span class="pill" th:if="${b.partOfGroup}" title="Part of a multi-machine request">Group</span>
                    </td>
                    <td>
                        <strong th:text="${b.jobSiteDistrict}">District</strong><br/>
                        <span class="muted" th:text="${b.jobSiteAddress}">Address</span>
                    </td>
                    <td><span th:text="${b.startDate}">start</span> &rarr; <span th:text="${b.endDate}">end</span></td>
                    <td th:text="${b.days}">1</td>
                    <td><span th:text="${currencySymbol}">Rs.</span> <span th:text="${#numbers.formatDecimal(b.totalAmount,1,'COMMA',2,'POINT')}">0</span></td>
                    <td><span class="pill" th:classappend="${'pill-' + b.status.name().toLowerCase()}" th:text="${b.status.displayName}">Status</span></td>
                    <td style="display:flex;gap:.4rem;flex-wrap:wrap">
                        <th:block th:if="${b.status.name() == 'PENDING'}">
                            <form th:action="@{'/admin/bookings/' + ${b.id} + '/approve'}" method="post">
                                <button class="btn btn-primary btn-sm" type="submit">Approve</button>
                            </form>
                            <form th:action="@{'/admin/bookings/' + ${b.id} + '/reject'}" method="post">
                                <button class="btn btn-danger btn-sm" type="submit">Reject</button>
                            </form>
                        </th:block>
                        <a class="btn btn-ghost btn-sm"
                           th:if="${replaceable != null and replaceable.contains(b.id)}"
                           th:href="@{'/admin/bookings/' + ${b.id} + '/replace'}">Replace machine</a>

                        <form th:if="${b.status.name() == 'APPROVED'}"
                              th:action="@{'/admin/bookings/' + ${b.id} + '/cancel'}" method="post"
                              th:attr="onsubmit=|return confirm('${cancellationNotes != null and cancellationNotes.containsKey(b.id) ? cancellationNotes.get(b.id) : ''} Cancel this booking?')|">
                            <button class="btn btn-danger btn-sm" type="submit"
                                    th:text="${cancellableUnpaid != null and cancellableUnpaid.contains(b.id)} ? 'Cancel unpaid' : 'Cancel &amp; refund'">Cancel</button>
                        </form>

                        <a class="btn btn-primary btn-sm"
                           th:if="${needsInspection != null and needsInspection.contains(b.id)}"
                           th:href="@{'/admin/bookings/' + ${b.id} + '/inspection'}">File return inspection</a>

                        <span class="muted"
                              th:if="${b.status.name() != 'PENDING' and b.status.name() != 'APPROVED'
                                       and (needsInspection == null or !needsInspection.contains(b.id))}">&mdash;</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
