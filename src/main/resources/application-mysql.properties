# ==========================================================================
# MySQL profile - for use with MySQL Workbench / a real MySQL server.
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# First create the schema in Workbench:  CREATE DATABASE dozernet;
# Then update the username/password below to match your MySQL login.
# ==========================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/dozernet?createDatabaseIfNotExist=true&serverTimezone=Asia/Colombo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root123

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Use "update" so data persists across restarts; switch to create-drop to reset.
spring.jpa.hibernate.ddl-auto=update
# Note: Hibernate may create MySQL ENUM columns for Java enums. After adding new
# enum values (e.g. InvoiceStatus.CANCELLED, PaymentMethod.CARD), alter those
# columns to VARCHAR(32) or recreate the schema — ddl-auto=update does not widen ENUMs.

# Load seed data (idempotent inserts) after schema is ready
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
