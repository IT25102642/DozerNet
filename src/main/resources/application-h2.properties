# ==========================================================================
# H2 in-memory database profile (default) - zero setup, great for dev/tests
# Console available at: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:dozernet   |  user: sa  |  password: (blank)
# ==========================================================================
spring.datasource.url=jdbc:h2:mem:dozernet;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Load seed data after schema creation
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
