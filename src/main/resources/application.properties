# ==========================================================================
# DozerNet - main configuration
# Default profile is "h2" so the app runs instantly with no DB setup.
# Switch to MySQL (for MySQL Workbench) by setting: spring.profiles.active=mysql
# ==========================================================================
spring.application.name=DozerNet
spring.profiles.active=h2

# Thymeleaf
spring.thymeleaf.cache=false

# JPA (common)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Security policy: sign users out after 30 minutes of inactivity
server.servlet.session.timeout=30m

# Document uploads (NIC / licence / ownership proof / inspection photos)
dozernet.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Demo e-mail sender shown in the notification log
dozernet.mail.from=no-reply@dozernet.lk

# Currency / locale (Sri Lanka)
dozernet.currency-symbol=Rs.
dozernet.locale=en-LK

# Financial rules (client-confirmed)
dozernet.vat-rate=0.18
dozernet.owner-commission-rate=0.10

# Show SQL for learning/demo transparency
spring.jpa.show-sql=false
